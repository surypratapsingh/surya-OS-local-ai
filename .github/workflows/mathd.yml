# mathd has no CI coverage in check.yml (which is kernel-only), and the
# owner's Windows host cannot link test binaries (no MSVC/MinGW). This
# workflow is the crate's execution oracle across host targets:
# - x86_64-unknown-linux-gnu (Linux default)
# - x86_64-unknown-linux-musl (minimal Linux static libc)
# - windows-latest (Windows MSVC)

name: mathd

on:
  push:
    paths:
      - "mathd/**"
      - ".github/workflows/mathd.yml"
  pull_request:
    paths:
      - "mathd/**"
      - ".github/workflows/mathd.yml"

jobs:
  test:
    name: test (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with clippy and rustfmt)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd mathd && cargo test

      - name: Clippy (deny warnings)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd mathd && cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd mathd && cargo fmt --check

  test-musl:
    name: test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools and target
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-unknown-linux-musl
          rustup show

      - name: Test (musl)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd mathd && cargo test --target x86_64-unknown-linux-musl

      - name: Clippy (deny warnings, musl)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd mathd && cargo clippy --target x86_64-unknown-linux-musl --all-targets -- -D warnings

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: Test (windows)
        run: |
          cd mathd
          cargo test

      - name: Clippy (deny warnings, windows)
        run: |
          cd mathd
          cargo clippy --all-targets -- -D warnings

      - name: Format check (windows)
        run: |
          cd mathd
          cargo fmt --check
