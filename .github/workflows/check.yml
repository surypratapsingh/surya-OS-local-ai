name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vendored Limine + font reference are committed and hash-pinned by
      # tools/manifest/bootchain.sha256 (scripts/trust.sh). Never re-download
      # them here: a silently changed upstream must fail the build, not pass it.

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf gdisk dosfstools mtools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target x86_64-unknown-none

      - name: Clippy (deny warnings)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd kernel && cargo clippy --release -- -D warnings

      - name: Format check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd kernel && cargo fmt --check

      - name: Run full check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/check.sh

      # C5/R15: two `git archive HEAD` extractions, both artifacts hashed.
      # Fails if the kernel ELF or nova.hdd is missing/empty or the builds
      # differ.  Validated on Linux by run 39993080674 (repro-dispatch).
      - name: Reproducible builds (R15)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/repro-check.sh

      - name: Upload boot-test serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: |
            build/*.log
          if-no-files-found: ignore
