[package]
name = "nucleus"
version = "0.1.0"
edition = "2021"
description = "NOVA/Nucleus - the from-scratch kernel of the NOVA local-first AI OS (K1: boots via Limine, draws to framebuffer)"
license = "UNLICENSED"

[[bin]]
name = "nucleus"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
overflow-checks = true
debug = true
