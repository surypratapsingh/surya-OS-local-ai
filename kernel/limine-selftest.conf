# Nucleus boot menu entry for CI self-test (Limine v12.9.x config format).
# Like limine.conf, except `novatest` on the command line makes the kernel
# exit cleanly via isa-debug-exit after NOVA_BOOT_OK, and only this config
# loads the FAT32 corpus module the fat gate mounts.

timeout: 3

/NOVA (Nucleus) [selftest]
    protocol: limine
    path: boot(1):/NUCLEUS
    kernel_cmdline: novatest
    module_path: boot(1):/fat32-corpus.img
    resolution: 1024x768x32
