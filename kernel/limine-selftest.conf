# Nucleus boot menu entry for CI self-test (Limine v12.9.x config format).
# Identical to limine.conf except `novatest` on the command line makes the
# kernel exit cleanly via isa-debug-exit after NOVA_BOOT_OK.

timeout: 3

/NOVA (Nucleus) [selftest]
    protocol: limine
    path: boot(1):/NUCLEUS
    kernel_cmdline: novatest
    resolution: 1024x768x32
