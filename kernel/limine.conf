# Nucleus boot menu entry (Limine v12.9.x config format).
# Installed at /EFI/BOOT/LIMINE.CONF on the ESP by scripts/build-disk.sh.
# C4: Uses path#blake2b for kernel file verification.
# Updated by scripts/build-disk.sh with kernel hash.

timeout: 3
serial: yes

/NOVA (Nucleus)
    protocol: limine
    path: boot(1):/NUCLEUS#blake2b:PLACEHOLDER_KERNEL_HASH
    kernel_cmdline: fatcorpus=/fat32-corpus.img
    module_path: boot(1):/fat32-corpus.img
    resolution: 1024x768x32
