# Nucleus boot menu entry (Limine v12.9.x config format).
# Installed at /EFI/BOOT/LIMINE.CONF on the ESP by scripts/build-disk.sh.
# C4: The placeholder in the path line below is replaced by scripts/build-disk.sh with
# a real 128-hex-char blake2b digest (hashlib.blake2b, digest_size=64) of the
# exact kernel ELF that lands on the ESP. Limine's URI parser (vendored
# limine-12.9.0 common/lib/uri.c lines 65-90) takes everything after `#` as
# the hash and panics unless it is exactly 128 hex characters, with NO
# algorithm prefix; the intended syntax is CONFIG.md lines 435-437:
#   boot():/somemodule.tar#<128 hex chars>
# Updated by scripts/build-disk.sh with kernel hash.

# No FAT32 corpus module here: only the selftest (limine-selftest.conf)
# reads it, and loading the ~33 MiB corpus cost ~1-2 s per boot
# (docs/logs/r2-step4-boottime.log).

timeout: 3
serial: yes

/NOVA (Nucleus)
    protocol: limine
    path: boot(1):/NUCLEUS#KERNEL_BLAKE2B_512_PLACEHOLDER
    resolution: 1024x768x32
