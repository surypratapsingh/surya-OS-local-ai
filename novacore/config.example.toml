# Copy to config.toml and make only local paths point to your chosen runner.
# NovaCore never downloads a model or contacts a remote endpoint.

[model]
# The command runs without a shell. Two modes:
# 1. use_stdin=true (preferred, default): prompt is sent via stdin, no file created
# 2. use_stdin=false: `{prompt_file}` is replaced with a file in state_dir/prompts/
# Adapt flags to the exact local runner and model you installed.
command = ["C:/tools/llama-cli.exe", "-m", "C:/models/nova.gguf", "--n-predict", "256"]
use_stdin = true
timeout_seconds = 120
max_output_chars = 8000

# Optional (N1, N4): commands by chat. A second model call picks at most one
# desktop action from the [desktop] table below; the broker checks it and runs
# it. Leave this table out and every message is plain chat.
#
# Default: NOVA's own command model, trained in this repository
# (intent/README.md). Nothing to download; it runs in plain Python. Change the
# three paths to your Python and your copy of the repository. -I (isolated
# mode) is needed: NovaCore starts the runner with a reduced environment.
[router]
command = ["C:/Python313/python.exe", "-I", "C:/nova/novacore/src/novacore/intent.py", "--model", "C:/nova/intent/model/nova-intent.bin", "{schema_file}"]
use_stdin = true
timeout_seconds = 30
max_output_chars = 2000

# Alternative: a downloaded model through llama.cpp. UNVERIFIED: these flags
# were read from llama.cpp's source (common/arg.cpp, 2026-10-30 tree), not run.
# -jf limits the answer to the JSON Schema NovaCore writes to {schema_file}.
# command = ["C:/tools/llama-completion.exe", "-m", "C:/models/router.gguf", "-f", "{prompt_file}", "-jf", "{schema_file}", "-no-cnv", "--no-display-prompt", "-n", "128", "--temp", "0"]
# use_stdin = false
# timeout_seconds = 60

# Optional (N1): what the desktop bridge may touch. Nothing outside it.
[desktop]
# true: every action waits for your typed "yes". Keep it true until the N3
# evaluation shows your router model picks actions correctly.
confirm_all_actions = true
# files.find and files.open search only inside these folders (absolute paths).
folders = ["C:/Users/you/Documents", "C:/Users/you/Music"]

# apps.open starts only these, by name. The program must be an absolute path.
[desktop.apps]
notepad = ["C:/Windows/System32/notepad.exe"]
calculator = ["C:/Windows/System32/calc.exe"]

# Optional (N2): always-on voice, offline. Run with --voice. A listener program
# hears the microphone and prints text; NovaCore acts only on lines that start
# with a wake word ("nova", "hey nova", "ok nova") and drops every other line.
# A speaker program says each reply. Windows: nothing to install (System.Speech).
# UNVERIFIED: the two Windows scripts were not run in the session that wrote them.
# [voice]
# listener = ["C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:/nova/novacore/voice/windows-listen.ps1"]
# speaker = ["C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:/nova/novacore/voice/windows-speak.ps1"]
# Linux: speaker = ["/usr/bin/espeak-ng", "--stdin"]; listener: any program that
# prints one recognised utterance per line (for example whisper.cpp's stream tool).

# Optional (N4d): NOVA learns from your own commands. Off unless you turn it on.
# Your yes to a proposed action is kept as a lesson for those exact words (the
# words "nova", "please", "can you" and "thanks" at the start or end are
# ignored), and next time those words skip the router. Your no keeps NOVA from
# offering that action for those words again. /teach WORDS => chat and
# /teach WORDS => CAPABILITY {json} teach directly; /lessons lists them.
# Lessons stay in state_dir/lessons.jsonl on this computer; memory.save is never
# learned. With confirm_all_actions = false most actions never ask, so NOVA then
# learns only what you /teach.
# [learning]
# enabled = true
# trust_learned = true    # false: a learned action still waits for your yes

[conversation]
history_turns = 12
memory_results = 6

[storage]
# This path is relative to this configuration file.
state_dir = "data"
